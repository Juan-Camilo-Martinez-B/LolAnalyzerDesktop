<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LolAnalyzer - In-Game Overlay</title>
    <script>
      (function () {
        var preference = 'light';
        try {
          var raw = localStorage.getItem('lolanalyzer.settings.v1');
          if (raw) {
            var saved = JSON.parse(raw).theme;
            if (saved === 'light' || saved === 'dark' || saved === 'system') preference = saved;
          }
        } catch (e) {}
        var resolved = preference === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;
        document.documentElement.setAttribute('data-theme', resolved);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-transparent select-none overflow-hidden" style="background: transparent !important; margin: 0; padding: 0;">
    <div id="overlay-root"></div>
    <script type="module" src="/src/overlay/overlayMain.tsx"></script>
  </body>
</html>
